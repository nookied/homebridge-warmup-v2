name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']  # release.yml handles tag pushes
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      # setup-node v5+ auto-caches when package.json has a `packageManager`
      # field; ours does not, and `cache: npm` below is explicit.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (offline + integration)
        run: npm test

      - name: Smoke (require entry, registerPlatform check)
        run: npm run smoke
